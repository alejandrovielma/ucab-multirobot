#VRML_SIM R2025a utf8
# UCAB cube collector (Phineas / Ferb).
# LewanSoul / Hiwonder mecanum chassis: 186 x 161 x 91 mm, 65 mm wheels, TT 1:120 3-6 V motors WITHOUT encoders.
# Electronics: Raspberry Pi 5 + Cokoino 4WD HAT (DRV8833), 2S 18650 battery.
# Planned sensors: OV5647 camera (~54 degrees), 4 TCRT5000 underneath, HC-SR04 in front, FC-51 and TCS34725 on the scoop,
# MPU6050 (accelerometer + gyroscope, no compass).
# One-cube scoop with a ~32 mm U-shaped slot, moved by an SG90 servo.
# Every measurement not from the manufacturer is estimated: measure and adjust.
# template language: javascript

PROTO RecolectorUCAB [
  field SFVec3f    translation     0 0 0
  field SFRotation rotation        0 0 1 0
  field SFString   name            "Phineas"
  field SFString   controller      "recolector_teleop"
  field MFString   controllerArgs  []
  field SFString   window          "<none>"
  field MFString   marcadorUrl     "textures/aruco_phineas_id1.png"
  field SFColor    colorChasis     0.15 0.15 0.17
  field SFFloat    masaCuerpo      0.66      # kg (chasis 0.59 kg + electronica, sin ruedas ni pala)
  field SFFloat    velMaxMotor     10.5      # rad/s (~100 rpm: TT 1:120 a ~6 V)
  field SFFloat    torqueMaxMotor  0.15      # N*m (estimado TT 1:120)
  field MFNode     extensiones     []        # para agregar sensores sin tocar el PROTO
]
{
  %<
    const wheelR = 0.0325;    // mecanum wheel radius, 65 mm
    const wheelW = 0.03;      // wheel width
    const axleX = 0.0605;      // half the wheelbase
    const axleY = 0.0655;      // half the track (161 mm - wheel width)
    const ruedas = [
      { n: 'fl', x:  axleX, y:  axleY, mat: 'ExteriorWheelMat' },
      { n: 'fr', x:  axleX, y: -axleY, mat: 'InteriorWheelMat' },
      { n: 'rl', x: -axleX, y:  axleY, mat: 'InteriorWheelMat' },
      { n: 'rr', x: -axleX, y: -axleY, mat: 'ExteriorWheelMat' }
    ];
    const lineas = [
      { n: 'fl', x:  0.075, y:  0.035 },
      { n: 'fr', x:  0.075, y: -0.035 },
      { n: 'rl', x: -0.075, y:  0.035 },
      { n: 'rr', x: -0.075, y: -0.035 }
    ];
  >%
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    model "RecolectorUCAB"
    controller IS controller
    controllerArgs IS controllerArgs
    window IS window
    children [
      # ---------------- Structure (visual only) ----------------
      DEF PLACA_INFERIOR Pose {
        translation 0 0 0.045
        children [
          Shape {
            appearance DEF ALUMINIO PBRAppearance { baseColor IS colorChasis roughness 0.5 metalness 0.6 }
            geometry Box { size 0.17 0.095 0.0025 }
          }
        ]
      }
      DEF PLACA_SUPERIOR Pose {
        translation -0.005 0 0.08
        children [
          Shape {
            appearance USE ALUMINIO
            geometry Box { size 0.15 0.095 0.0025 }
          }
        ]
      }
      %< for (const sx of [1, -1]) for (const sy of [1, -1]) { >%
      Pose {
        translation %<= sx * 0.065 >% %<= sy * 0.04 >% 0.0625
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.75 0.6 0.3 roughness 0.4 metalness 0.8 }
            geometry Cylinder { height 0.033 radius 0.0025 }
          }
        ]
      }
      Pose {
        translation %<= sx * 0.03 >% %<= sy * 0.035 >% 0.033
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.95 0.8 0.15 roughness 0.6 metalness 0 }
            geometry Box { size 0.064 0.022 0.019 }
          }
        ]
      }
      %< } >%
      DEF PORTAPILAS_2S Pose {
        translation -0.02 0 0.0575
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.05 0.05 0.05 roughness 0.8 metalness 0 }
            geometry Box { size 0.077 0.042 0.021 }
          }
        ]
      }
      DEF REGULADOR_5V Pose {
        translation 0.045 0 0.0525
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.1 0.25 0.6 roughness 0.6 metalness 0 }
            geometry Box { size 0.026 0.05 0.012 }
          }
        ]
      }
      DEF PI5_HAT Pose {
        translation -0.02 0 0.0995
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.1 0.35 0.2 roughness 0.6 metalness 0.1 }
            geometry Box { size 0.085 0.056 0.035 }
          }
        ]
      }
      DEF MARCADOR_ARUCO Pose {
        translation -0.02 0 0.1175
        children [
          Shape {
            appearance PBRAppearance {
              baseColorMap ImageTexture { url IS marcadorUrl filtering 0 }
              roughness 1
              metalness 0
            }
            geometry Plane { size 0.06 0.06 }
          }
        ]
      }
      DEF SOPORTE_CAMARA Pose {
        translation 0.07 0 0.095
        children [
          Shape {
            appearance USE ALUMINIO
            geometry Box { size 0.004 0.03 0.03 }
          }
        ]
      }

      # ---------------- Mecanum wheels (no encoders) ----------------
      %< for (const r of ruedas) { >%
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor %<= r.x >% %<= r.y >% %<= wheelR >%
        }
        device [
          RotationalMotor {
            name "motor_%<= r.n >%"
            maxVelocity IS velMaxMotor
            maxTorque IS torqueMaxMotor
          }
        ]
        endPoint Solid {
          translation %<= r.x >% %<= r.y >% %<= wheelR >%
          rotation 1 0 0 1.5708
          name "rueda_%<= r.n >%"
          contactMaterial "%<= r.mat >%"
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.08 0.08 0.08 roughness 0.9 metalness 0 }
              geometry DEF CIL_RUEDA Cylinder { height %<= wheelW >% radius %<= wheelR >% subdivision 24 }
            }
            Pose {
              translation 0 0 %<= (r.y > 0 ? 1 : -1) * 0.0155 >%
              children [
                Shape {
                  appearance PBRAppearance { baseColor 0.7 0.7 0.72 roughness 0.4 metalness 0.7 }
                  geometry Cylinder { height 0.002 radius 0.022 }
                }
              ]
            }
          ]
          boundingObject USE CIL_RUEDA
          physics Physics { density -1 mass 0.05 }
        }
      }
      %< } >%

      # ---------------- One-cube scoop (SG90 servo) ----------------
      # angle 0 = scoop down (pushes); negative = raises it (about -0.7 rad, ~40 degrees, releases the cube)
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.09 0 0.055
          minStop -1.0
          maxStop 0.02
        }
        device [
          RotationalMotor {
            name "servo_pala"
            maxVelocity 10.5
            maxTorque 0.18
            minPosition -1.0
            maxPosition 0.0
            controlPID 10 0 0
          }
        ]
        endPoint Solid {
          translation 0.09 0 0.055
          name "pala"
          children [
            DEF PALA_FORMA Group {
              children [
                Pose { translation 0.003 0 -0.008 children [ Shape { appearance DEF PLA_AP PBRAppearance { baseColor 0.95 0.5 0.1 roughness 0.6 metalness 0 } geometry Box { size 0.006 0.05 0.016 } } ] }
                Pose { translation 0.021 0 -0.0155 children [ Shape { appearance USE PLA_AP geometry Box { size 0.042 0.05 0.003 } } ] }
                Pose { translation 0.038 0 -0.035 children [ Shape { appearance USE PLA_AP geometry Box { size 0.003 0.038 0.035 } } ] }
                Pose { translation 0.0555 0.0175 -0.035 children [ Shape { appearance USE PLA_AP geometry Box { size 0.032 0.003 0.035 } } ] }
                Pose { translation 0.0555 -0.0175 -0.035 children [ Shape { appearance USE PLA_AP geometry Box { size 0.032 0.003 0.035 } } ] }
                Pose { translation 0.0858 0.031 -0.035 rotation 0 0 1 0.767 children [ Shape { appearance USE PLA_AP geometry Box { size 0.0396 0.003 0.035 } } ] }
                Pose { translation 0.0858 -0.031 -0.035 rotation 0 0 1 -0.767 children [ Shape { appearance USE PLA_AP geometry Box { size 0.0396 0.003 0.035 } } ] }
              ]
            }
            # FC-51: IR obstacle sensor on the left wall of the U, facing across (cube inside = 1)
            DistanceSensor {
              translation 0.054 0.0155 -0.04
              rotation 0 0 1 -1.5708
              name "ir_pala"
              type "infra-red"
              lookupTable [ 0 1 0, 0.02 1 0, 0.0201 0 0 ]
              numberOfRays 1
            }
            # TCS34725: colour sensor looking at the cube up close (simulated with a 4x4 camera)
            Camera {
              translation 0.0405 0 -0.028
              rotation 0 1 0 0.35
              name "color_pala"
              width 4
              height 4
              fieldOfView 0.6
              near 0.002
            }
          ]
          boundingObject Group {
            children [
              Pose { translation 0.021 0 -0.0155 children [ Box { size 0.042 0.05 0.003 } ] }
              Pose { translation 0.038 0 -0.035 children [ Box { size 0.003 0.038 0.035 } ] }
              Pose { translation 0.0555 0.0175 -0.035 children [ Box { size 0.032 0.003 0.035 } ] }
              Pose { translation 0.0555 -0.0175 -0.035 children [ Box { size 0.032 0.003 0.035 } ] }
              Pose { translation 0.0858 0.031 -0.035 rotation 0 0 1 0.767 children [ Box { size 0.0396 0.003 0.035 } ] }
              Pose { translation 0.0858 -0.031 -0.035 rotation 0 0 1 -0.767 children [ Box { size 0.0396 0.003 0.035 } ] }
            ]
          }
          physics Physics { density -1 mass 0.03 }
        }
      }

      # ---------------- Sensors ----------------
      # OV5647 camera (standard ~54 degree lens), tilted ~24 degrees down
      Camera {
        translation 0.075 0 0.11
        rotation 0 1 0 0.42
        name "camara"
        fieldOfView 0.94
        width 640
        height 480
        near 0.01
        far 3
        noise 0.01
      }
      # TCRT5000 x4 facing the floor (white = high value, black line = low value)
      %< for (const l of lineas) { >%
      DistanceSensor {
        translation %<= l.x >% %<= l.y >% 0.012
        rotation 0 1 0 1.5708
        name "linea_%<= l.n >%"
        type "infra-red"
        lookupTable [ 0 1023 0.01, 0.025 0 0.01 ]
        numberOfRays 1
      }
      %< } >%
      # HC-SR04: 2 cm to 4 m, ~15 degree cone, returns metres
      DistanceSensor {
        translation 0.088 0 0.068
        name "ultrasonido"
        type "sonar"
        lookupTable [ 0.02 0.02 0.005, 4 4 0.005 ]
        numberOfRays 5
        aperture 0.26
      }
      # MPU6050 (no magnetometer: no absolute heading)
      Accelerometer {
        translation -0.02 0 0.085
        name "acelerometro"
        lookupTable [ -19.6 -19.6 0.02, 19.6 19.6 0.02 ]
      }
      Gyro {
        translation -0.02 0 0.085
        name "giroscopio"
        lookupTable [ -8.7 -8.7 0.005, 8.7 8.7 0.005 ]
      }
      Group { children IS extensiones }
    ]
    boundingObject Group {
      children [
        Pose { translation 0 0 0.062 children [ Box { size 0.17 0.095 0.036 } ] }
        Pose { translation -0.02 0 0.0995 children [ Box { size 0.085 0.056 0.035 } ] }
      ]
    }
    physics Physics {
      density -1
      mass IS masaCuerpo
      centerOfMass [ 0 0 0.05 ]
    }
  }
}
