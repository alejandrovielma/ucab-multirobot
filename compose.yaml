# Docker development environment. Instructions in docker/README.md.
#
#   docker compose up sim            everything inside Docker (windowless Webots) + web viewer
#   docker compose up sim-external   nodes in Docker, Webots open on your machine (Windows/Linux)
#   docker compose run --rm dev      shell with ROS 2 to build, test and lint
#
# Camera web viewer: http://localhost:8080

x-ros: &ros
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: sim
  image: recolector:sim
  init: true
  volumes:
    - .:/ws
    # build/install/log live in Docker volumes, not in your folder
    - ws_build:/ws/build
    - ws_install:/ws/install
    - ws_log:/ws/log
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

services:
  sim:
    <<: *ros
    ports:
      - "8080:8080"
    command: ros2 launch bringup simulation.launch.py webots:=headless

  sim-external:
    <<: *ros
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      ros2 launch bringup simulation.launch.py webots:=none
      webots_url:=tcp://${WEBOTS_HOST:-host.docker.internal}:1234/Phineas

  dev:
    <<: *ros
    command: bash

volumes:
  ws_build:
  ws_install:
  ws_log:
