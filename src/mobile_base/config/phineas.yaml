# Parameters for Phineas (namespace /phineas). Ferb uses config/ferb.yaml with the same keys.
# Floats must keep their decimal point: ROS 2 rejects an int for a double parameter.

/phineas/behavior:
  ros__parameters:
    robot: phineas
    my_colors: [red, orange, yellow]
    peer_pose_topic: /ferb/pose
    rate_hz: 10.0
    cube_timeout: 0.5
    explore_speed: 0.12
    turn_speed: 1.2
    turn_min: 0.8
    turn_max: 2.0
    turn_angle_min: 2.356  # 135 deg
    turn_angle_max: 3.927  # 225 deg
    k_turn: 1.5
    approach_speed: 0.10
    approach_min_scale: 0.3
    approach_align: 0.15
    lost_timeout: 1.0
    capture_cy: 0.62  # IMX219-120: cube at the scoop mouth measured at 0.66 in Webots
    capture_speed: 0.08
    capture_time: 1.0
    has_gate: false  # no servo on the real robots yet: true only with the scoop gate fitted (feat/scoop-gate)
    gate_close_time: 0.4
    gate_open_time: 0.4
    scoop_lost_timeout: 1.0
    carry_speed: 0.08
    carry_min_speed: 0.05
    carry_max_turn: 0.6
    k_heading: 1.5
    arrive_radius: 0.10
    lead_in: 0.10  # aim this far past the entry when close to the axis
    lead_in_width: 0.20
    wait_x: 0.0  # waiting point while the other robot holds the lease (no lease needed)
    wait_y: 0.22
    request_period: 1.0
    enter_speed: 0.05
    enter_lookahead: 0.10
    square_align_gain: 0.8  # while entering, steer to center the blue square seen by the camera
    reverse_speed: 0.04
    drop_timeout: 6.0
    track_horizon: 0.3  # body geofence (keep equal to safety_gate)
    body_front: 0.095
    body_rear: 0.095
    body_half_width: 0.082
    plan_replan_distance: 0.04  # carry planner (core/planner.py)
    plan_replan_heading: 0.3
    plan_max_expansions: 30000
    plan_retry: 2.0
    plan_give_up: 6.0
    entry_heading_tolerance: 0.524  # 30 deg
    gate_entry_across_tolerance: 0.02  # with the gate the entry is precise
    gate_entry_along_band: 0.05
    gate_entry_heading_tolerance: 0.175  # 10 deg
    skip_time: 3.0
    backoff_time: 3.0
    open_probe_distance: 0.5
    # Delivery square (core/delivery.py), measured on the real track 2026-10-15. Frame: origin at the
    # rectangle center, x east, y north. The robot approaches heading west (pi); offsets are of the
    # robot center BEFORE the boundary (inner tape edge at x -0.585) along the approach axis.
    # Keep these equal in behavior and safety_gate.
    zone_x: -0.6865  # blue interior center
    zone_y: 0.0085
    zone_heading: 3.14159265
    zone_square_depth: 0.203  # blue interior along the axis: boundary at x -0.585
    zone_entry_offset: 0.298  # x -0.287: 0.20 m before the drop
    zone_drop_offset: 0.098  # x -0.487: body front 3 mm before the boundary, cube 4 cm inside the blue
    zone_exit_offset: 0.205  # x -0.38: the scoop tip ends east of the cube
    zone_corridor_half_width: 0.08  # blue interior is 16.7 cm wide across the axis

/phineas/safety_gate:
  ros__parameters:
    peer_pose_topic: /ferb/pose
    rate_hz: 20.0
    cmd_timeout: 0.5
    require_heartbeat: true
    heartbeat_timeout: 2.0
    require_pose: true
    pose_timeout: 0.5
    front_cone_deg: 60.0
    stop_distance: 0.40
    slow_distance: 0.60
    avoid_distance: 0.60
    avoid_turn: 0.6
    has_priority: true  # Phineas has right of way; Ferb backs off in a deadlock
    deadlock_time: 3.0
    escape_turn: 0.8
    escape_time: 1.5
    carry_min_forward: 0.05
    carry_max_turn: 0.6
    carry_arc_away_bearing: 25.0
    carry_arc_away_min_distance: 0.30
    max_reverse: 0.05
    track_horizon: 0.3
    body_front: 0.095  # body without the scoop: the scoop may step on the tape, the body may not
    body_rear: 0.095
    body_half_width: 0.082
    track_return_cone: 45.0
    # Delivery square (core/delivery.py), measured on the real track 2026-10-15. Frame: origin at the
    # rectangle center, x east, y north. The robot approaches heading west (pi); offsets are of the
    # robot center BEFORE the boundary (inner tape edge at x -0.585) along the approach axis.
    # Keep these equal in behavior and safety_gate.
    zone_x: -0.6865  # blue interior center
    zone_y: 0.0085
    zone_heading: 3.14159265
    zone_square_depth: 0.203  # blue interior along the axis: boundary at x -0.585
    zone_entry_offset: 0.298  # x -0.287: 0.20 m before the drop
    zone_drop_offset: 0.098  # x -0.487: body front 3 mm before the boundary, cube 4 cm inside the blue
    zone_exit_offset: 0.205  # x -0.38: the scoop tip ends east of the cube
    zone_corridor_half_width: 0.08  # blue interior is 16.7 cm wide across the axis

/phineas/cube_detector:
  ros__parameters:
    s_min: 80
    v_min: 50
    min_area: 150.0
    max_area: 60000.0
    aspect_min: 0.6
    aspect_max: 1.6
    min_solidity: 0.8
    open_kernel: 5
    # Window between the scoop walls (calibracion_pala.wbt): cube in the U 0.60, at the mouth 0.04.
    scoop_x_half: 0.2
    scoop_y_min: 0.74
    scoop_y_max: 0.84
    scoop_min_fill: 0.30
    # Blue delivery square: largest region of this hue range bigger than square_min_area px; it is
    # reported apart (square_* in the cubes message) and never as a cube. Calibrate on the robot.
    square_color: blue
    square_min_area: 12000.0
    # OpenCV hue (0-179) ranges as [lo1, hi1, lo2, hi2, ...]; calibrate with the real cubes.
    hue_ranges:
      red: [0, 8, 169, 179]
      orange: [9, 18]
      yellow: [19, 34]
      green: [35, 89]
      blue: [90, 124]
      purple: [125, 168]

/phineas/hat_motor_driver:
  ros__parameters:
    wheel_radius: 0.0325
    lx: 0.0605
    ly: 0.0655
    max_wheel_speed: 10.5
    battery_voltage: 8.4
    motor_max_voltage: 6.0
    pwm_frequency: 1000.0
    watchdog_timeout: 0.3
    wheel_signs: [1, 1, 1, 1]
    nsleep_pins: [12, 13]
    pins_fl: [17, 27]
    pins_fr: [24, 25]
    pins_rl: [22, 23]
    pins_rr: [26, 16]
    gpio_chip: 4  # verify with `gpioinfo` on the Pi 5 (RP1 header chip)
    dry_run: false

/phineas/line_sensor:
  ros__parameters:
    pin: 5
    active_level: 1
    rate_hz: 50.0
    gpio_chip: 4
    dry_run: false

/phineas/camera:
  ros__parameters:
    device: "0"
    width: 640
    height: 480
    fps: 15.0
    frame_id: phineas_camera
