# Parameters for Phineas (namespace /phineas). Ferb uses config/ferb.yaml with the same keys.
# Floats must keep their decimal point: ROS 2 rejects an int for a double parameter.

/phineas/behavior:
  ros__parameters:
    robot: phineas
    my_colors: ""  # target colors at start, comma separated; empty = IDLE until a mission arrives (`ros2 param set /<robot>/behavior my_colors "blue,green"`)
    avoid_colors: ""  # forbidden colors, comma separated: touching them costs points (counted; every non-target cube is avoided). A string, not a list: rcl cannot parse an empty YAML list
    peer_pose_topic: /ferb/pose
    rate_hz: 10.0
    cube_timeout: 0.5
    explore_speed: 0.12
    turn_speed: 1.2
    blind_turn_min: 0.96  # rad, border turn without a pose (0.8 s at 1.2 rad/s)
    blind_turn_max: 2.4  # rad (2.0 s at 1.2 rad/s)
    turn_angle_min: 2.356  # 135 deg
    turn_angle_max: 3.927  # 225 deg
    k_turn: 1.5
    approach_speed: 0.10
    approach_turn_min: 0.4  # rad/s, slowest spin while centering a cube
    approach_align: 0.15
    lost_timeout: 1.0
    approach_min_area: 400.0  # px, smaller (far) targets are not approached: they flicker
    assume_capture: true  # the real scoop is open: a cube at its middle plate is below the camera view (measured by the team), so a target that vanishes at the mouth while driving on is assumed captured
    assume_mouth_cy: 0.55
    assume_window: 1.5  # s
    approach_strafe_cy: 0.45  # cube this close: center it on the U by sliding sideways (the mouth is ~4 cm)
    approach_strafe_tol: 0.04  # |cx| counted as centered
    approach_strafe_speed: 0.03  # m/s
    approach_strafe_time: 3.0  # s sliding per approach episode, then drive/capture on (a cube just beyond the tolerance never centers)
    spin_hold: 1.0  # s a carry spin keeps its direction (two cues flipping it made the robot dither)
    approach_spin_timeout: 4.0  # s centering by spinning: longer = the cube turns with the robot
    approach_backoff_time: 1.5  # s backing off to leave it
    capture_cy: 0.62  # IMX219-120: cube at the scoop mouth measured at 0.66 in Webots
    capture_speed: 0.08
    capture_distance: 0.08  # m pushed so the cube enters the U (48 mm deep); time = distance / capture_speed
    capture_fails: 3  # empty captures within capture_fail_window: ignore the cube for skip_time (it keeps slipping out of the U)
    capture_fail_window: 20.0  # s
    has_gate: false  # no servo on the real robots yet: true only with the scoop gate fitted (feat/scoop-gate)
    gate_close_time: 0.4
    gate_open_time: 0.4
    scoop_lost_timeout: 1.0
    carry_speed: 0.08
    carry_max_turn: 0.4  # rad/s, slow in-place spin with a cube (no arcs: team rule 2026-10-27)
    heading_tolerance: 0.1  # rad, spin before translating when the heading is off by more
    arrive_radius: 0.10
    wait_x: 0.0  # waiting point while the other robot holds the lease (no lease needed)
    wait_y: 0.22
    request_period: 1.0
    enter_speed: 0.05
    enter_lookahead: 0.10
    square_align_gain: 0.8  # while entering, steer to center the blue square seen by the camera
    reverse_speed: 0.04
    drop_timeout: 6.0
    drop_tolerance: 0.02  # start the drop within 2 cm of the drop point (gate prediction stops ~1.3 cm short)
    track_horizon: 0.3  # body geofence (keep equal to safety_gate)
    body_front: 0.095
    body_rear: 0.095
    body_half_width: 0.082
    plan_replan_distance: 0.04  # carry planner (core/planner.py)
    plan_replan_heading: 0.3
    plan_max_expansions: 30000
    plan_retry: 2.0
    plan_give_up: 6.0
    gate_entry_across_tolerance: 0.02  # the plan spins in place, so the entry is precise
    gate_entry_along_band: 0.05
    gate_entry_heading_tolerance: 0.175  # 10 deg
    skip_time: 3.0
    backoff_time: 3.0
    line_backoff: 0.14  # line sensor at the robot center: reverse the body front (0.095) plus spin sweep room (~0.125 body sweep radius) so the body is back inside before spinning
    explore_tape_stop: 0.18  # m, estimated tape this close ahead: turn before touching it (guided exploration)
    explore_heading_tol: 0.3  # rad, spin toward the exploration goal beyond this
    avoid_cy: 0.45  # cube of another color (red) lower in the image than this is in the scoop path: steer around it; calibrate
    avoid_cx: 0.3  # |cx_norm| of the scoop path at that distance; calibrate
    avoid_timeout: 3.0  # s dodging the same cube (it turns with the robot: stuck or misread) before ignoring it for skip_time
    avoid_cycles: 3  # avoid spins within avoid_window: the guided spin toward a goal behind the cube keeps undoing them
    avoid_window: 6.0  # s
    guide_off_time: 4.0  # s driving straight on the cleared heading (no spin toward the exploration goal) after avoid_cycles
    shed_distance: 0.08  # red cube in the U (48 mm deep): reverse this far, then turn away
    shed_confirm: 0.3  # s a non-target color must stay in the scoop window (neighbor hues: red and orange)
    clear_after: 2  # skips of a target hidden behind other cubes before pushing through
    clear_window: 20.0
    clear_time: 5.0
    clear_turn: 1.5708  # spin that throws a caught non-target cube aside (90 deg)
    corner_hits: 3  # line events within corner_window without a pose: half turn after a longer backoff
    corner_window: 30.0  # s (one border cycle lasts >= 5 s at the lab speed caps: 10 s never saw 3 hits)
    use_lease: false  # no zone arbiter (Perry) for now: the square is taken as free (team decision 2026-10-27)
    # Delivery with the robot camera only (no overhead pose); calibrate on the track.
    square_search_time: 15.0  # s spinning without seeing the square before a short drive forward
    square_probe_distance: 0.12  # m of the short drive forward (time = distance / carry_speed)
    square_align: 0.15  # |square_cx| that counts as centered
    square_reach_cy: 0.47  # DELIVER starts ~0.40 m from the square center (entry offset 0.298 before its boundary); depends on the camera model, calibrate
    axis_delivery: true  # line up on the perpendicular between the green and red rectangles, push straight
    axis_align: 0.1  # |refs_cx| below which the midpoint counts as straight ahead
    axis_skew_tol: 0.06  # |refs_skew| below which the robot counts as on the axis (calibrate)
    axis_strafe_speed: 0.04  # m/s sideways to get onto the axis
    yield_to_peer: false  # waits for the other robot near the square (Ferb yields to Phineas)
    peer_yield_distance: 0.5  # m, other robot's marker closer than this: wait
    yield_timeout: 10.0  # s waiting before giving the cube up
    dodge_limit: 3  # sidesteps around non-target cubes while carrying
    dodge_time: 6.0  # s of one sidestep episode before the transport is abandoned
    deliver_guard_cx: 0.6  # |cx| of non-target cubes that call the push into the square off (scoop walls included)
    deliver_guard_cy: 0.5  # and closer than this cy
    deliver_push_time: 4.0  # s pushing in at enter_speed: 0.20 m from the entry to the drop point (core/delivery.py)
    deliver_back_time: 2.5  # s backing out at reverse_speed
    # Provisional (calibrate facing the square at 30 and 10 cm; cubes next to the scoop appear at cy ~0.80).
    # Enabled on purpose: a wrong value only makes the robot turn away early, while 0.0 (off) lets the
    # body drive into the square through its open side when there is no overhead pose (lab tests).
    square_border_cy: 0.55
    open_probe_distance: 0.5
    # Delivery square (core/delivery.py), measured on the real track 2026-10-15. Frame: origin at the
    # rectangle center, x east, y north. The robot approaches heading west (pi); offsets are of the
    # robot center BEFORE the boundary (inner tape edge at x -0.585) along the approach axis.
    # Keep these equal in behavior and safety_gate.
    zone_x: -0.6865  # blue interior center
    zone_y: 0.0085
    zone_heading: 3.14159265
    zone_square_depth: 0.203  # blue interior along the axis: boundary at x -0.585
    zone_entry_offset: 0.298  # x -0.287: 0.20 m before the drop
    zone_drop_offset: 0.098  # x -0.487: body front 3 mm before the boundary, cube 4 cm inside the blue
    zone_exit_offset: 0.205  # x -0.38: the scoop tip ends east of the cube
    zone_corridor_half_width: 0.08  # blue interior is 16.7 cm wide across the axis

/phineas/safety_gate:
  ros__parameters:
    peer_pose_topic: /ferb/pose
    rate_hz: 20.0
    cmd_timeout: 0.5
    require_heartbeat: false  # no zone arbiter (Perry) for now (team decision 2026-10-27); Webots sets it true
    heartbeat_timeout: 2.0
    require_pose: false  # no overhead camera: the robot uses only its own camera (2026-10-27); Webots sets it true
    pose_timeout: 0.5
    front_cone_deg: 60.0
    stop_distance: 0.40
    slow_distance: 0.60
    avoid_distance: 0.60
    avoid_turn: 0.6
    has_priority: true  # Phineas has right of way; Ferb backs off in a deadlock
    deadlock_time: 3.0
    escape_turn: 0.8
    escape_time: 1.5
    carry_max_turn: 0.4  # rad/s, slow in-place spin with a cube (no arcs: team rule 2026-10-27)
    max_side_speed: 0.05  # m/s, any translation that is not straight ahead (sideways, diagonal, back)
    peer_memory: 2.0  # s the other robot's last bearing still counts after it leaves the camera view
    max_accel: 0.4  # m/s^2, ramp when speeding up (rollers slip and motors stall on hard starts); stopping is immediate
    max_alpha: 2.0  # rad/s^2
    max_decel_carry: 0.3  # m/s^2, braking with a cube (it keeps its inertia and slides off the delivery axis)
    max_decel_alpha_carry: 1.5  # rad/s^2
    line_clear_time: 0.3  # s of white before a new black reading counts as a new tape (the TCRT5000 flickers on its edge)
    track_horizon: 0.3
    body_front: 0.095  # body without the scoop: the scoop may step on the tape, the body may not
    body_rear: 0.095
    body_half_width: 0.082
    track_return_cone: 45.0
    # Delivery square (core/delivery.py), measured on the real track 2026-10-15. Frame: origin at the
    # rectangle center, x east, y north. The robot approaches heading west (pi); offsets are of the
    # robot center BEFORE the boundary (inner tape edge at x -0.585) along the approach axis.
    # Keep these equal in behavior and safety_gate.
    zone_x: -0.6865  # blue interior center
    zone_y: 0.0085
    zone_heading: 3.14159265
    zone_square_depth: 0.203  # blue interior along the axis: boundary at x -0.585
    zone_entry_offset: 0.298  # x -0.287: 0.20 m before the drop
    zone_drop_offset: 0.098  # x -0.487: body front 3 mm before the boundary, cube 4 cm inside the blue
    zone_exit_offset: 0.205  # x -0.38: the scoop tip ends east of the cube
    zone_corridor_half_width: 0.08  # blue interior is 16.7 cm wide across the axis

/phineas/cube_detector:
  ros__parameters:
    s_min: 80
    v_min: 50
    min_area: 150.0
    max_area: 60000.0
    aspect_min: 0.6
    aspect_max: 1.6
    min_solidity: 0.8
    open_kernel: 5
    # Window between the scoop walls (calibracion_pala.wbt): cube in the U 0.60, at the mouth 0.04.
    scoop_x_half: 0.2
    scoop_y_min: 0.74
    scoop_y_max: 0.84
    scoop_min_fill: 0.30
    # Blue delivery square: largest region of this hue range bigger than square_min_area px; it is
    # reported apart (square_* in the cubes message) and never as a cube. Calibrate on the robot.
    square_color: blue
    square_min_area: 12000.0
    square_far_area: 300.0  # px, a far square is a thin strip
    square_far_aspect: 4.0  # width / height: a cube is never that elongated
    # Green and red rectangles beside the square (delivery axis): told from cubes by size and shape.
    # PLACEHOLDERS: measure the real rectangles and calibrate from the robot camera.
    ref_min_area: 500.0  # px, small: seen from afar they are thin strips (they are landmarks for the filter)
    ref_min_aspect: 2.0  # long side / short side
    # The other robot, seen by this camera (no overhead camera, 2026-10-27): ArUco DICT_4X4_50 on it,
    # side marker_size m. Phineas carries id 1 and Ferb id 2, as for the overhead camera.
    peer_marker_id: 2  # Ferb
    marker_size: 0.05  # m: measure the printed marker
    camera_hfov: 1.60  # rad, IMX219-120
    # OpenCV hue (0-179) ranges as [lo1, hi1, lo2, hi2, ...]; calibrate with the real cubes.
    hue_ranges:
      red: [0, 8, 169, 179]
      orange: [9, 18]
      yellow: [19, 34]
      green: [35, 89]
      blue: [90, 124]
      purple: [125, 168]

/phineas/hat_motor_driver:
  ros__parameters:
    # Backend: fusion_hat (SunFounder Fusion HAT+, current robots) or cokoino_drv8833 (previous
    # Cokoino 4WD HAT through lgpio). Without the fusion_hat library the node runs dry (logged).
    motor_backend: fusion_hat
    wheel_radius: 0.0325
    lx: 0.0605
    ly: 0.0655
    max_wheel_speed: 10.5
    battery_voltage: 8.4  # 2S Li-ion 7.4 V nominal, 8.4 V full: duty cap 6.0 / 8.4 = 0.71
    motor_max_voltage: 6.0
    watchdog_timeout: 0.3
    wheel_signs: [1, 1, 1, 1]
    dry_run: false
    # Fusion HAT+: motor port of each wheel [fl, fr, rl, rr] and direction flip done by the HAT.
    # Measured and confirmed on Phineas 2026-10-27 with `lab_robot.py motors --wheels fr,rr,fl,rl
    # --only-wheels`: each wheel moves in that order, forward first. Re-measure after rewiring.
    fusion_ports: [M3, M0, M2, M1]  # fl M3, fr M0, rl M2, rr M1
    fusion_reversed: [false, true, false, true]  # the right wheels (fr, rr) turned backward on "forward"
    # Power (percent, fl fr rl rr) at which each wheel starts turning: a non-zero command is spread over
    # [start, cap] so slow speeds do not stall (tools/lab/lab_robot.py threshold). 0 = not measured.
    fusion_start_power: [20.0, 20.0, 20.0, 20.0]  # PROVISIONAL 2026-10-27: the star test moved at 21-28 % and a mission at 10-17 % did not; replace with `lab_robot.py threshold`
    # Per-wheel scale in (0, 1] to even out motor speeds (drift when driving straight on the floor).
    fusion_trim: [1.0, 1.0, 1.0, 1.0]
    # Cokoino 4WD HAT (2x DRV8833), only with motor_backend cokoino_drv8833.
    pwm_frequency: 1000.0
    nsleep_pins: [12, 13]
    pins_fl: [17, 27]
    pins_fr: [24, 25]
    pins_rl: [22, 23]
    pins_rr: [26, 16]
    gpio_chip: 0  # Pi 5 header = pinctrl-rp1, gpiochip0 on kernel 7.0 (verified with gpiodetect on Phineas 2026-10-20); older kernels used gpiochip4

/phineas/line_sensor:
  ros__parameters:
    pin: 5
    active_level: 1
    rate_hz: 50.0
    gpio_chip: 0  # Pi 5 header = pinctrl-rp1, gpiochip0 on kernel 7.0 (verified with gpiodetect on Phineas 2026-10-20); older kernels used gpiochip4
    dry_run: false

/phineas/camera:
  ros__parameters:
    device: "0"
    width: 640
    height: 480
    fps: 15.0
    frame_id: phineas_camera
