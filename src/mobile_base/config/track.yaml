# Track interior (body limit) as a polygon in the overhead-camera / Webots frame, meters, flattened
# [x1, y1, x2, y2, ...]. Loaded for behavior and safety_gate of both robots (body geofence).
#
# Real track measured on 2026-10-15 (tape 1.8 cm wide): rectangle 120.6 x 74 cm at the OUTER tape
# edge, so the inner edge is at x +-0.585, y +-0.352. Frame: origin at the rectangle center, x east
# (along the 120.6 cm side), y north. The blue delivery square sticks out of the west side
# (interior x -0.788..-0.585, y -0.075..0.092) and is EXCLUDED on purpose: only the scoop may enter
# it, never the body (the delivery corridor in core/delivery.py lets the robot reach its edge).
# The same geometry renders the Webots texture (tools/sim/generate_track.py). Without this list
# there is no geofence.

/**:
  ros__parameters:
    track_polygon: [
      -0.585, -0.352,
      0.585, -0.352,
      0.585, 0.352,
      -0.585, 0.352
    ]
